server:
  port: 8080

spring:
  application:
    name: departmental-archive

  datasource:
    url: jdbc:postgresql://localhost:5432/archive_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 16

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000

  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000

  upload-dir: uploads

  seed:
    admin-email: admin@college.edu
    admin-password: ${ADMIN_PASSWORD}
    faculty-email: faculty@college.edu
    faculty-password: ${FACULTY_PASSWORD}